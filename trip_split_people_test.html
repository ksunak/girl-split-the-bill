<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trip Split - People Test</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7fb;margin:0;color:#172033}
main{max-width:650px;margin:auto;padding:18px}
.card{background:white;border:1px solid #e6e8ef;border-radius:18px;padding:18px;margin:14px 0}
h1{margin-bottom:5px}.muted{color:#667085;font-size:14px}
input,button{font:inherit;padding:12px;border-radius:11px;border:1px solid #cfd4df}
.addrow{display:flex;gap:8px;margin-top:14px}
.addrow input{flex:1;min-width:0}
button{background:#5b5bd6;color:white;border:none;font-weight:700;cursor:pointer}
.person{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid #e6e8ef}
.remove{background:white;color:#a33;border:1px solid #ddd;padding:6px 10px}
.count{margin-top:12px;font-weight:650}
</style>
</head>
<body>
<main>
<h1>Trip Split ✈️</h1>
<div class="muted">Let's test adding people before we build the rest.</div>
<section class="card">
<label for="trip"><b>Trip name</b></label><br>
<input id="trip" style="width:100%;box-sizing:border-box;margin-top:6px" placeholder="Napa Weekend">

<div class="addrow">
<input id="name" placeholder="Person's name">
<button id="add" type="button">+ Add</button>
</div>

<div id="count" class="count">0 people added</div>
<div id="list"></div>
</section>
</main>

<script>
(function(){
  var people = [];
  var nameInput = document.getElementById("name");
  var addButton = document.getElementById("add");
  var list = document.getElementById("list");
  var count = document.getElementById("count");

  function render(){
    list.innerHTML = "";
    for(var i=0;i<people.length;i++){
      (function(index){
        var row = document.createElement("div");
        row.className = "person";
        var label = document.createElement("span");
        label.textContent = people[index];
        var remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove";
        remove.textContent = "Remove";
        remove.onclick = function(){
          people.splice(index,1);
          render();
        };
        row.appendChild(label);
        row.appendChild(remove);
        list.appendChild(row);
      })(i);
    }
    count.textContent = people.length + (people.length===1 ? " person added" : " people added");
  }

  function addPerson(){
    var n = nameInput.value.replace(/^\s+|\s+$/g,"");
    if(!n){ nameInput.focus(); return; }
    for(var i=0;i<people.length;i++){
      if(people[i].toLowerCase()===n.toLowerCase()){
        alert(n+" is already added.");
        return;
      }
    }
    people.push(n);
    nameInput.value = "";
    render();
    nameInput.focus();
  }

  addButton.onclick = addPerson;
  nameInput.onkeydown = function(e){
    e = e || window.event;
    if(e.key === "Enter" || e.keyCode === 13){
      if(e.preventDefault)e.preventDefault();
      addPerson();
      return false;
    }
  };
})();
</script>
</body>
</html>
